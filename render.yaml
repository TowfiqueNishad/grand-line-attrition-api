services:
  - type: web
    name: grand-line-api
    runtime: python
    rootDir: attrition-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: https://grand-line-attrition-api.vercel.app
